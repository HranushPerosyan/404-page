<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyGreen Turf - Premium Artificial Lawn Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/montserrat@latest/latin-400-normal.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/montserrat@latest/latin-600-normal.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/montserrat@latest/latin-700-normal.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/montserrat@latest/latin-800-normal.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/poppins@latest/latin-400-normal.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/poppins@latest/latin-500-normal.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/fontsource/fonts/poppins@latest/latin-600-normal.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green-dark: #1a5c2a;
            --green-primary: #2d8a4e;
            --green-light: #4caf50;
            --green-pale: #e8f5e9;
            --green-accent: #66bb6a;
            --gold: #f9a825;
            --gold-light: #fdd835;
            --dark: #1a1a2e;
            --gray: #6b7280;
            --light: #f8faf8;
            --white: #ffffff;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--dark);
            overflow-x: hidden;
            background: var(--white);
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Montserrat', sans-serif;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            background: transparent;
        }

        nav.scrolled {
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            padding: 0.7rem 2rem;
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1.6rem;
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s;
        }

        nav.scrolled .logo {
            color: var(--green-dark);
        }

        .logo svg {
            width: 36px;
            height: 36px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--white);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s;
            position: relative;
        }

        nav.scrolled .nav-links a {
            color: var(--dark);
        }

        .nav-links a:hover {
            color: var(--green-accent);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--green-accent);
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-cta {
            background: var(--green-primary);
            color: var(--white) !important;
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s !important;
        }

        .nav-cta:hover {
            background: var(--green-dark);
            transform: translateY(-2px);
        }

        .nav-cta::after {
            display: none !important;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
        }

        .mobile-menu-btn span {
            display: block;
            width: 28px;
            height: 3px;
            background: var(--white);
            margin: 5px 0;
            border-radius: 2px;
            transition: all 0.3s;
        }

        nav.scrolled .mobile-menu-btn span {
            background: var(--dark);
        }

        /* Hero Section */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .hero-bg-image {
            position: absolute;
            inset: 0;
            background-image: url('https://cdn.shopify.com/s/files/1/0997/6004/6396/files/modern-australian-home-front-yard-artificial-turf-contemporary-residential-house-grass-lawn-clean-low-410765330.webp?v=1793296543');
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        .hero-bg-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(13, 59, 26, 0.85),
                rgba(26, 92, 42, 0.75),
                rgba(45, 138, 78, 0.7)
            );
            z-index: 2;
        }

        .hero-bg-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.1;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(255,255,255,0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(102,187,106,0.4) 0%, transparent 40%),
                radial-gradient(circle at 60% 80%, rgba(255,255,255,0.2) 0%, transparent 40%);
            z-index: 3;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .hero-text {
            color: var(--white);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeInUp 0.8s ease;
        }

        .hero-badge .dot {
            width: 8px;
            height: 8px;
            background: var(--green-accent);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.5);
            }
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        .hero h1 .highlight {
            background: linear-gradient(135deg, var(--green-accent), var(--gold-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.15rem;
            opacity: 0.9;
            line-height: 1.7;
            margin-bottom: 2rem;
            max-width: 500px;
            animation: fadeInUp 0.8s ease 0.4s both;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            animation: fadeInUp 0.8s ease 0.6s both;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--green-light), var(--green-primary));
            color: var(--white);
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.5);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            color: var(--white);
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-3px);
        }

        /* Continue with the remaining original CSS, HTML sections, and JavaScript
           from the complete file linked above. */
    </style>
</head>
